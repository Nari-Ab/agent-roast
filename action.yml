name: "agent-roast"
description: "Zero-telemetry audit for AI coding shortcuts, skipped tests, and panic loops."
author: "Nariman Abdukarimov"
branding:
  icon: "shield"
  color: "black"

inputs:
  mode:
    description: "review (full before/after context) or audit (legacy added lines)"
    required: false
    default: "review"
  base:
    description: "Base branch or commit SHA for diff analysis"
    required: false
    default: ""
  head:
    description: "Head commit SHA for pull request analysis"
    required: false
    default: ""
  fail-on:
    description: "Comma-separated detectors that trigger pipeline failure (test-skip, test-focus, type-escape, swallowed-error, trivial-assert, stub-abandonment)"
    required: false
    default: ""
  format:
    description: "Output format: github, terminal, json, markdown (review also supports sarif)"
    required: false
    default: "github"

outputs:
  complete:
    description: "Whether every in-scope changed source pair was compared (review mode)"
    value: ${{ steps.run-audit.outputs.complete }}
  existing-count:
    description: "Pre-existing findings in compared changed files (review mode)"
    value: ${{ steps.run-audit.outputs.existing-count }}
  removed-count:
    description: "Findings no longer detected in compared source (review mode)"
    value: ${{ steps.run-audit.outputs.removed-count }}
  passed:
    description: "Whether the audit passed with zero blocking infractions"
    value: ${{ steps.run-audit.outputs.passed }}
  infractions-count:
    description: "Total number of infractions detected"
    value: ${{ steps.run-audit.outputs.infractions-count }}
  has-supported-changes:
    description: "Whether the pull request modified supported source files"
    value: ${{ steps.run-audit.outputs.has-supported-changes }}

runs:
  using: "composite"
  steps:
    - name: Run agent-roast audit
      id: run-audit
      shell: bash
      env:
        ROAST_MODE: ${{ inputs.mode }}
        INPUT_BASE: ${{ inputs.base }}
        INPUT_HEAD: ${{ inputs.head }}
        ROAST_FAIL_ON: ${{ inputs.fail-on }}
        ROAST_FORMAT: ${{ inputs.format }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        EVENT_BEFORE_SHA: ${{ github.event.before }}
        HEAD_SHA: ${{ github.sha }}
      run: |
        if [ "${GITHUB_EVENT_NAME:-}" = "pull_request_target" ]; then
          echo "::error::Use pull_request with read-only permissions; pull_request_target is unsupported."
          exit 2
        fi
        case "$ROAST_MODE" in
          review|audit) ;;
          *) echo "::error::mode must be review or audit"; exit 2 ;;
        esac
        ROAST_BASE="${INPUT_BASE:-${PR_BASE_SHA:-${EVENT_BEFORE_SHA}}}"
        ROAST_HEAD="${INPUT_HEAD:-${PR_HEAD_SHA:-${HEAD_SHA}}}"

        if [ -z "$ROAST_BASE" ]; then
          echo "::error::Could not resolve base commit SHA. Specify 'base' input or configure actions/checkout with fetch-depth: 0."
          exit 2
        fi

        REPO_DIR="$PWD"
        INSTALL_DIR="$(mktemp -d "${RUNNER_TEMP:-/tmp}/agent-roast.XXXXXX")"
        trap 'rm -rf "$INSTALL_DIR"' EXIT
        (cd "$INSTALL_DIR" && npm install --prefix "$INSTALL_DIR" agent-roast@0.7.0 --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org) > /dev/null

        COMMAND_ARGS=()
        if [ "$ROAST_MODE" = "review" ]; then
          COMMAND_ARGS+=(review)
        fi

        EXTRA_ARGS=()
        if [ -n "$ROAST_FAIL_ON" ]; then
          EXTRA_ARGS+=(--fail-on "$ROAST_FAIL_ON")
        fi

        "$INSTALL_DIR/node_modules/.bin/agent-roast" "${COMMAND_ARGS[@]}" "$REPO_DIR" \
          --base "$ROAST_BASE" \
          --head "$ROAST_HEAD" \
          "${EXTRA_ARGS[@]}" \
          --format "$ROAST_FORMAT"
