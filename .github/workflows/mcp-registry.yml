name: Publish to the MCP registry

# Lists the MCP server (server.json) in the official MCP registry with GitHub OIDC, so there is no token to store and no
# login on a laptop. It runs after "Release to npm" succeeds, because the registry only accepts a package that is already
# on npm, and by hand from the Actions tab for a version that is already there (docs/maintainers.md).
on:
  workflow_run:
    workflows: ["Release to npm"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: mcp-registry
  cancel-in-progress: false

env:
  # The official publisher, pinned to a release and to the digest in that release's checksums file instead of "latest"
  # (github.com/modelcontextprotocol/registry/releases). Raise both together.
  MCP_PUBLISHER_VERSION: "1.8.9"
  MCP_PUBLISHER_SHA256: "4d527ca8f1ced0394c962dc925c2a4a4addef441cbefd62501c875e9481823a8"

jobs:
  registry:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Wait until npm serves the version in server.json
        run: |
          package="$(jq -r '.packages[0].identifier' server.json)"
          version="$(jq -r '.packages[0].version' server.json)"
          for attempt in $(seq 1 60); do
            if npm view "${package}@${version}" version --prefer-online >/dev/null 2>&1; then
              echo "${package}@${version} is on npm"
              exit 0
            fi
            sleep 15
          done
          echo "::error::${package}@${version} is not on npm after 15 minutes."
          exit 1
      - name: Install mcp-publisher
        run: |
          archive="mcp-publisher_linux_amd64.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/${archive}"
          echo "${MCP_PUBLISHER_SHA256}  ${archive}" | sha256sum -c -
          tar xzf "$archive" mcp-publisher
      # The workflow's OIDC identity proves the repository owner, which is what the io.github.Nari-Ab/ name needs.
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
