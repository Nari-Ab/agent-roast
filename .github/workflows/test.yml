name: Test CLI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: CLI Node ${{ matrix.cli }} (test runner Node 22)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cli: [18, 20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.cli }}
      - name: Remember the CLI runtime
        run: echo "AGENT_ROAST_TEST_NODE=$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - name: Verify CLI user workflows on the selected runtime
        run: PATH="$(dirname "$AGENT_ROAST_TEST_NODE"):$PATH" "$AGENT_ROAST_TEST_NODE" scripts/verify-user-workflows.mjs dist/cli.js

  macos:
    name: Full suite on macOS (Node 22)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test

  smoke:
    name: First-run smoke on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node scripts/smoke.mjs dist/cli.js
