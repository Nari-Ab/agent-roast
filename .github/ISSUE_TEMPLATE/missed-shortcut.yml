name: A weakened check it did not catch
description: A change made a test, assertion, coverage gate or CI step weaker and agent-roast stayed quiet
labels: [missed-shortcut]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. Please remove anything private; a few lines are enough.
  - type: input
    id: version
    attributes:
      label: agent-roast version
      placeholder: "npx agent-roast --version"
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Language or file type
      options: [JavaScript / TypeScript, Python, Go, Rust, Java / Kotlin, C#, Ruby, PHP, Swift, CI or config file, other]
    validations:
      required: true
  - type: textarea
    id: before
    attributes:
      label: Before the change
      render: text
    validations:
      required: true
  - type: textarea
    id: after
    attributes:
      label: After the change
      render: text
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why does it weaken the check?
