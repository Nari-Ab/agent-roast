name: A finding that was wrong
description: agent-roast flagged a change that is fine
labels: [false-positive]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. A false alarm is the most useful report, because every one makes the tool less trusted.
        A few lines are enough. Please remove anything private.
  - type: input
    id: version
    attributes:
      label: agent-roast version
      placeholder: "npx agent-roast --version"
    validations:
      required: true
  - type: dropdown
    id: rule
    attributes:
      label: Rule that fired
      options: [assertion-weakened, guard-weakened, assertion-removed, test-removed, expectation-rewritten, test-skip, test-focus, trivial-assert, swallowed-error, type-escape, stub-abandonment, not sure]
    validations:
      required: true
  - type: textarea
    id: before
    attributes:
      label: Before the change
      render: text
    validations:
      required: true
  - type: textarea
    id: after
    attributes:
      label: After the change
      render: text
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why is this fine?
