<text class="l2" x="24" y="94" xml:space="preserve"><tspan>A build was red. The "fix" below turns it green without touching the code under test:</tspan></text>
<text class="l3" x="24" y="115" xml:space="preserve"></text>
<text class="l4" x="24" y="136" xml:space="preserve"><tspan>  </tspan><tspan class="c">src/cart.test.ts</tspan><tspan>          toBe(42) → toBeDefined() · it.skip(…) · expect(true).toBe(true)</tspan></text>
<text class="l5" x="24" y="157" xml:space="preserve"><tspan>  </tspan><tspan class="c">vitest.config.ts</tspan><tspan>          coverage thresholds lowered (lines 90 → 50, branches 85 → 40)</tspan></text>
<text class="l6" x="24" y="178" xml:space="preserve"><tspan>  </tspan><tspan class="c">.github/workflows/ci.yml</tspan><tspan>  continue-on-error: true on the test step</tspan></text>
<text class="l7" x="24" y="199" xml:space="preserve"></text>
<text class="l8" x="24" y="220" xml:space="preserve"><tspan class="b">agent-roast — working tree review: BLOCKED</tspan></text>
<text class="l9" x="24" y="241" xml:space="preserve"><tspan>  6 new · 0 existing · 0 no longer detected</tspan></text>
<text class="l10" x="24" y="262" xml:space="preserve"><tspan class="r">  FAIL [test-skip] src/cart.test.ts:8</tspan></text>
<text class="l11" x="24" y="283" xml:space="preserve"><tspan>    it.skip("applies a discount", () =&gt; {</tspan></text>
<text class="l12" x="24" y="304" xml:space="preserve"><tspan class="r">  FAIL [trivial-assert] src/cart.test.ts:13</tspan></text>
<text class="l13" x="24" y="325" xml:space="preserve"><tspan>    expect(true).toBe(true);</tspan></text>
<text class="l14" x="24" y="346" xml:space="preserve"><tspan class="r">  FAIL [assertion-weakened] src/cart.test.ts:4</tspan></text>
<text class="l15" x="24" y="367" xml:space="preserve"><tspan>    sums the prices: expect(total([10, 20, 12])).toBe(42) → expect(total([10, 20, 12])).toBeDefined()</tspan></text>
<text class="l16" x="24" y="388" xml:space="preserve"><tspan class="r">  FAIL [guard-weakened] .github/workflows/ci.yml:10</tspan></text>
<text class="l17" x="24" y="409" xml:space="preserve"><tspan>    continue-on-error: true</tspan></text>
<text class="l18" x="24" y="430" xml:space="preserve"><tspan class="r">  FAIL [guard-weakened] vitest.config.ts:4</tspan></text>
<text class="l19" x="24" y="451" xml:space="preserve"><tspan>    lines: 90 → 50</tspan></text>
<text class="l20" x="24" y="472" xml:space="preserve"><tspan class="r">  FAIL [guard-weakened] vitest.config.ts:4</tspan></text>
<text class="l21" x="24" y="493" xml:space="preserve"><tspan>    branches: 85 → 40</tspan></text>
<text class="l22" x="24" y="514" xml:space="preserve"></text>
<text class="l23" x="24" y="535" xml:space="preserve"><tspan class="r">  BLOCKED: test-skip, trivial-assert, assertion-weakened, guard-weakened.</tspan></text>
